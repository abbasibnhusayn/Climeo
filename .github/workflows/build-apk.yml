# Climeo — developed by Halool.
#
# Builds a real, installable Android APK entirely in GitHub's cloud —
# no Flutter/Android Studio needed on your machine. Trigger from the
# Actions tab, download the artifact when it finishes, install on your
# phone.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL the app should call (e.g. https://onrender.com). See DEPLOYMENT.md to get a real one running first.'
        required: false
        default: 'http://localhost:8080'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            echo "No modern gradle script found — generating the Gradle scaffold."
            flutter create --platforms=android --org app.halool --project-name climeo /tmp/climeo_scaffold
            mkdir -p android
            cp -r /tmp/climeo_scaffold/android/. android/
          else
            echo "android/app/build.gradle.kts already present — using the committed scaffold as-is."
          fi

          git checkout -- \
            android/app/src/main/AndroidManifest.xml || true

      - name: Overwrite Configuration with Modern Required Patches
        run: |
          # Inject desugaring requirements into the modern compileOptions block inside build.gradle.kts
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          
          # Force set compilation SDK version parameters to 36 dynamically
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
          
          # Append the core library desugaring dependency link safely to the end of the script
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3") }' >> android/app/build.gradle.kts

      - name: Inject Location Permissions
        run: |
          # Add the hardware GPS request tags into the Android system file
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<application|' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (fails the build on real errors)
        run: flutter analyze --no-fatal-infos

      - name: Generate app icons from the real Climeo logo
        run: dart run flutter_launcher_icons || true

      - name: Generate splash screen
        run: dart run flutter_native_splash:create || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: climeo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
