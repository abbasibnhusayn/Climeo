name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL'
        required: false
        default: 'https://onrender.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean App Infrastructure
        run: |
          # Back up your code files securely
          mv lib ../_lib_backup
          mv pubspec.yaml ../_pubspec_backup
          
          # Delete any conflicting background folders completely
          rm -rf android ios web windows macos linux
          
          # Recreate a brand-new pristine app container structure
          flutter create . --project-name=climeo --org=app.halool --platforms=android
          
          # Remove placeholder folders and restore your code files
          rm -rf lib pubspec.yaml
          mv ../_lib_backup lib
          mv ../_pubspec_backup pubspec.yaml

      - name: Disable Ungenerated Asset Plugins
        run: |
          # Strip the launcher icon and splash configurations so they do not crash the app launch
          sed -i '/flutter_launcher_icons:/,$d' pubspec.yaml || true

      - name: Overwrite Configuration with Modern Required Patches
        run: |
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3") }' >> android/app/build.gradle.kts

      - name: Inject Location and Internet Permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<application|' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Compile Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: climeo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
