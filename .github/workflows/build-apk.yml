name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL'
        required: false
        default: 'https://onrender.com' # Safe fallback link to prevent crashing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org app.halool --project-name climeo /tmp/climeo_scaffold
            mkdir -p android
            cp -r /tmp/climeo_scaffold/android/. android/
          fi
          git checkout -- android/app/src/main/AndroidManifest.xml || true

      - name: Overwrite Configuration with Modern Required Patches
        run: |
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle.kts
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.3") }' >> android/app/build.gradle.kts

      - name: Inject Location and Internet Permissions
        run: |
          # This inserts BOTH location and internet hardware permission requests safely
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<application|' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ inputs.api_base_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: climeo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
